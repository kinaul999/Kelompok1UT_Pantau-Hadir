<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pantau Hadir</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --biru-sidebar: #b2c0e6;
            --biru-tua: #0b0b6b;
            --oranye: #f26419;
            --abu-kartu: #e8e8e8;
            --teks: #000;
            --lebar-sidebar: 184px;
            --font: "Plus Jakarta Sans", "Segoe UI", Roboto, Arial, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font);
            color: var(--teks);
            background: #fff;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--biru-tua);
            outline-offset: 2px;
        }

        /* ===== SIDEBAR ===== */
        aside {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--lebar-sidebar);
            display: flex;
            flex-direction: column;
            background: var(--biru-sidebar);
            z-index: 20;
            transition: transform .3s ease;
        }

        aside > div {
            height: 145px;
            display: grid;
            place-items: center;
        }

        aside > div img {
            width: 140px;
            height: auto;
            display: block;
            mix-blend-mode: multiply; /* menyatukan latar putih logo dengan sidebar */
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--biru-tua);
            text-decoration: none;
        }

        nav a:hover { background: rgba(255, 255, 255, .45); }

        nav a[aria-current="page"] { background: #fff; }

        aside footer {
            margin-top: auto;
            padding: 0 12px 10px;
            text-align: center;
        }

        aside footer button {
            width: 121px;
            height: 31px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font: 600 13px var(--font);
            color: var(--biru-tua);
            background: #fff;
            border: 1px solid #4a4fa8;
            border-radius: 6px;
            cursor: pointer;
        }

        aside footer button img {
            width: 14px;
            height: 14px;
            order: -1; /* ikon di sebelah kiri teks */
        }

        aside footer::after {
            content: "© 2026 Pantau Hadir App\A Sistem Absensi Pekerja Proyek";
            white-space: pre-line;
            display: block;
            margin-top: 12px;
            font-size: 8px;
            line-height: 1.25;
            color: #1b1b3a;
        }

        /* ===== KONTEN UTAMA ===== */
        main {
            margin-left: var(--lebar-sidebar);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left .3s ease;
        }

        /* Header oranye */
        main > header {
            height: 44px;
            padding: 0 14px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--oranye);
            color: #fff;
        }

        main > header h2 {
            margin: 0 auto 0 12px;
            font-size: 18px;
            font-style: italic;
            font-weight: 500;
        }

        main > header div {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 300;
        }

        main > header div img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1); /* ikon jadi putih */
        }

        /* Area dashboard */
        main > section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 22px;
        }

        main > section > h1 {
            margin: 0 30px;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        main > section > p {
            margin: 0 30px;
            font-size: 20px;
            font-weight: 400;
        }

        /* Judul bagian disembunyikan secara visual, tetap terbaca screen reader */
        section section > h2 {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* Tanggal dan waktu */
        section[aria-labelledby="judul-waktu"] {
            margin: 26px 52px 0 54px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--abu-kartu);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        section[aria-labelledby="judul-waktu"] p { margin: 0; }

        /* Statistik */
        section[aria-labelledby="judul-statistik"] {
            margin: 26px 52px 0 54px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 26px;
        }

        section[aria-labelledby="judul-statistik"] > div {
            padding: 10px 14px 12px;
            text-align: center;
            background: var(--abu-kartu);
            border-radius: 10px;
        }

        section[aria-labelledby="judul-statistik"] h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }

        section[aria-labelledby="judul-statistik"] p:first-of-type {
            position: relative;
            margin: 4px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
        }

        section[aria-labelledby="judul-statistik"] p:first-of-type img {
            position: absolute;
            left: 0;
            top: 50%;
            width: 24px;
            height: 24px;
            transform: translateY(-50%);
        }

        section[aria-labelledby="judul-statistik"] p:last-of-type {
            margin: 4px 0 0;
            font-size: 10px;
            font-weight: 400;
        }

        /* Ilustrasi di bagian bawah */
        main > section > div:last-child {
            margin-top: auto;
            padding-top: 16px;
            line-height: 0;
        }

        main > section > div:last-child img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 62vh;
            object-fit: cover;
            object-position: bottom;
        }

        /* ===== TOMBOL SLIDE SIDEBAR ===== */
        .tombol-menu {
            width: 32px;
            height: 32px;
            padding: 0;
            display: grid;
            place-items: center;
            color: #fff;
            background: transparent;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .tombol-menu:hover { background: rgba(255, 255, 255, .2); }

        .tombol-menu:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        .tombol-menu svg { width: 22px; height: 22px; }

        /* Sidebar tertutup: geser keluar layar, konten melebar */
        body.sidebar-tertutup aside { transform: translateX(-100%); }
        body.sidebar-tertutup main { margin-left: 0; }

        /* Latar gelap di belakang sidebar (hanya di layar kecil) */
        .latar-sidebar { display: none; }

        @media (prefers-reduced-motion: reduce) {
            aside, main { transition: none; }
        }

        /* ===== RESPONSIF ===== */
        @media (max-width: 720px) {
            /* Sidebar menjadi panel yang meluncur di atas konten */
            main { margin-left: 0; min-height: 0; }

            aside { box-shadow: 4px 0 16px rgba(0, 0, 0, .2); }

            body.sidebar-tertutup aside { box-shadow: none; }

            body:not(.sidebar-tertutup) .latar-sidebar {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 10;
                background: rgba(0, 0, 0, .4);
            }

            section[aria-labelledby="judul-waktu"],
            section[aria-labelledby="judul-statistik"] {
                margin-left: 16px;
                margin-right: 16px;
            }

            section[aria-labelledby="judul-statistik"] {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            main > section > h1,
            main > section > p { margin-left: 16px; margin-right: 16px; }
        }
    </style>
</head>
<body>

    <!-- LATAR GELAP (layar kecil) -->
    <div class="latar-sidebar" id="latar-sidebar"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div>
            <img src="assets/images/logo-pantau-hadir.jpg"
                 width="200"
                 alt="Pantau Hadir - Sistem Absensi Pekerja Proyek">
        </div>

        <nav>
            <ul>
                <li><a href="admin-dashboard.html" aria-current="page">Dashboard</a></li>
                <li><a href="rekapitulasi-absensi.html">Rekap Absensi</a></li>
                <li><a href="data-pekerja.html">Data Pekerja</a></li>
            </ul>
        </nav>

        <footer>
            <button type="button"> 
                Keluar                
                <img src="assets/icons/log-out.svg" width="10" alt="">
            </button>
            
        </footer>
    </aside>

    <!-- KONTEN UTAMA -->
    <main>

        <!-- HEADER -->
        <header>
            <button type="button" class="tombol-menu" id="tombol-menu"
                    aria-label="Tampilkan atau sembunyikan menu"
                    aria-controls="sidebar" aria-expanded="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <h2>PT. Jalan Baru</h2>

            <div>
                <span>Admin</span>
                <img src="assets/icons/users.svg" width="10" alt="">
            </div>
        </header>

        <!-- DASHBOARD -->
        <section aria-labelledby="judul-dashboard">
            <h1 id="judul-dashboard">Dashboard</h1>

            <p>Selamat datang, Administrator!</p>

            <!-- TANGGAL DAN WAKTU -->
            <section aria-labelledby="judul-waktu">
                <h2 id="judul-waktu">Tanggal dan Waktu</h2>

                <p>
                    <strong>Senin, 28 September 2026</strong>
                </p>

                <p>13:04:31 WIB</p>
            </section>

            <!-- STATISTIK -->
            <section aria-labelledby="judul-statistik">
                <h2 id="judul-statistik">Statistik Absensi</h2>

                <!-- TOTAL PEKERJA -->
                <div>
                    <h3>Total Pekerja</h3>
                    <p>
                        <img src="assets/icons/hard-hat.svg"
                             width="20" alt="">
                        45
                    </p>
                    <p>Terdaftar</p>
                </div>

                <!-- HADIR -->
                <div>
                    <h3>Hadir</h3>
                    <p>
                        <img src="assets/icons/circle-check.svg"
                             width="20" alt="">
                        45
                    </p>
                    <p>100% dari total</p>
                </div>

                <!-- TIDAK HADIR -->
                <div>
                    <h3>Tidak Hadir</h3>
                    <p>
                        <img src="assets/icons/circle-x.svg"
                             width="20" alt="">
                        0
                    </p>
                    <p>0% dari total</p>
                </div>
            </section>

            <!-- ILUSTRASI -->
            <div>
                <img src="assets/images/images-konstruksi-biru.jpg"
                     width="400"
                     alt="Ilustrasi konstruksi">
            </div>

        </section>

    </main>

    <script>
        (function () {
            var body = document.body;
            var tombol = document.getElementById('tombol-menu');
            var latar = document.getElementById('latar-sidebar');
            var layarKecil = window.matchMedia('(max-width: 720px)');

            function atur(tertutup) {
                body.classList.toggle('sidebar-tertutup', tertutup);
                tombol.setAttribute('aria-expanded', String(!tertutup));
            }

            // Layar kecil: mulai tertutup. Layar besar: mulai terbuka.
            atur(layarKecil.matches);
            layarKecil.addEventListener('change', function (e) { atur(e.matches); });

            tombol.addEventListener('click', function () {
                atur(!body.classList.contains('sidebar-tertutup'));
            });

            latar.addEventListener('click', function () { atur(true); });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && layarKecil.matches) atur(true);
            });
        })();
    </script>

</body>
</html>

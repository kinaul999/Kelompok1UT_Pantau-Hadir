<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pekerja — Pantau Hadir</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Cpath d='M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1z'/%3E%3Cpath d='M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5'/%3E%3C/svg%3E">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand-area">
        <div class="logo-box"><img class="logo-img" src="assets/images/logo-pantau-hadir.jpg" alt="Pantau Hadir"></div>
      </div>
      <nav>
        <a href="admin-dashboard.html"><span id="i-dash"></span> Dashboard</a>
        <a href="rekapitulasi-absensi.html"><span id="i-rekap"></span> Rekapitulasi Absensi</a>
        <a href="data-pekerja.html" class="active"><span id="i-pekerja"></span> Data Pekerja</a>
      </nav>
      <div class="side-foot">
        <a href="#" data-logout><span id="i-out"></span> Keluar</a>
      </div>
    </aside>
    <div class="overlay"></div>

    <div class="admin-main">
      <header class="topbar">
        <div class="flex gap-12">
          <button class="menu-toggle" aria-label="Buka menu"><span id="i-menu"></span></button>
          <h2 id="companyName">PT. Jalan Baru</h2>
        </div>
        <div class="user-chip">
          <div class="avatar"><span id="i-avatar"></span></div>
          <div><div style="font-weight:700;font-size:13px">Administrator</div><div class="text-xs text-muted">Admin</div></div>
        </div>
      </header>

      <main class="page">
        <div class="page-head">
          <div>
            <h1>Data Pekerja</h1>
            <p>Kelola seluruh pekerja terdaftar di sistem.</p>
          </div>
          <div class="flex gap-12">
            <button class="btn btn-ghost" id="btnExport"><span id="i-dl"></span> Ekspor CSV</button>
            <a href="tambah-pekerja.html" class="btn btn-primary"><span id="i-plus"></span> Tambah Pekerja</a>
          </div>
        </div>

        <div class="toolbar">
          <div class="search">
            <span id="i-search"></span>
            <input class="input" type="search" id="cari" placeholder="Cari nama atau NIK pekerja…">
          </div>
          <select id="filterSite" style="max-width:220px">
            <option value="">Semua Lokasi</option>
          </select>
          <button class="btn btn-ghost" id="btnReset"><span id="i-x"></span> Reset</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th><th>NIK</th><th>Nama Pekerja</th><th>Lokasi</th><th>Kata Sandi</th><th style="text-align:right">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty-state" id="empty" style="display:none">
            <span id="i-empty"></span>
            <p>Tidak ada data pekerja yang cocok.</p>
          </div>
        </div>
        <div class="flex between" style="flex-wrap:wrap;gap:12px;margin-top:14px">
          <div class="text-sm text-muted" id="info"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    PH.requireRole('admin');
    document.getElementById('i-dash').innerHTML = PH.icon('layout');
    document.getElementById('i-rekap').innerHTML = PH.icon('clipboard');
    document.getElementById('i-pekerja').innerHTML = PH.icon('users');
    document.getElementById('i-out').innerHTML = PH.icon('logout');
    document.getElementById('i-menu').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>';
    document.getElementById('i-avatar').innerHTML = PH.icon('shield');
    document.getElementById('i-dl').innerHTML = PH.icon('download');
    document.getElementById('i-plus').innerHTML = PH.icon('user-plus');
    document.getElementById('i-search').innerHTML = PH.icon('search');
    document.getElementById('i-x').innerHTML = PH.icon('x');
    document.getElementById('i-empty').innerHTML = PH.icon('users');
    document.getElementById('companyName').textContent = PH.getCompany().name;

    var siteSel = document.getElementById('filterSite');
    PH.SITES.forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; siteSel.appendChild(o); });

    var PER_PAGE = 10, page = 1, filtered = [];

    function applyFilter(){
      var q = document.getElementById('cari').value.trim().toLowerCase();
      var site = siteSel.value;
      filtered = PH.getWorkers().filter(function(w){
        var matchQ = !q || w.nama.toLowerCase().indexOf(q)>-1 || w.nik.toLowerCase().indexOf(q)>-1;
        var matchS = !site || w.site === site;
        return matchQ && matchS;
      }).sort(function(a,b){return a.nik.localeCompare(b.nik);});
      var maxPage = Math.max(1, Math.ceil(filtered.length/PER_PAGE));
      if (page > maxPage) page = maxPage;
      render();
    }

    function render(){
      var tbody = document.getElementById('tbody');
      var start = (page-1)*PER_PAGE;
      var rows = filtered.slice(start, start+PER_PAGE);
      document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
      tbody.innerHTML = rows.map(function(w, i){
        return '<tr>'+
          '<td>'+(start+i+1)+'</td>'+
          '<td><strong>'+w.nik+'</strong></td>'+
          '<td><div class="flex gap-12"><div class="avatar" style="width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none">'+PH.initials(w.nama)+'</div><div>'+w.nama+'</div></div></td>'+
          '<td><span class="badge badge-info">'+w.site+'</span></td>'+
          '<td style="font-family:monospace;letter-spacing:2px">••••••</td>'+
          '<td style="text-align:right"><div class="flex gap-8" style="justify-content:flex-end">'+
            '<a class="btn btn-ghost btn-icon" href="tambah-pekerja.html?id='+w.id+'" title="Edit" aria-label="Edit">'+PH.icon('edit')+'</a>'+
            '<button class="btn btn-danger btn-icon" data-del="'+w.id+'" title="Hapus" aria-label="Hapus">'+PH.icon('trash')+'</button>'+
          '</div></td></tr>';
      }).join('');

      tbody.querySelectorAll('[data-del]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-del');
          var w = PH.getWorkers().find(function(x){return x.id===id;});
          PH.confirmDialog('Hapus Pekerja', 'Yakin ingin menghapus <strong>'+w.nama+'</strong> ('+w.nik+')? Tindakan ini tidak dapat dibatalkan.', function(){
            PH.deleteWorker(id);
            PH.toast('Pekerja '+w.nama+' dihapus.', 'success');
            applyFilter();
          });
        });
      });

      // pagination
      var maxPage = Math.max(1, Math.ceil(filtered.length/PER_PAGE));
      var pag = document.getElementById('pagination');
      var html = '<button data-p="1" '+(page===1?'disabled':'')+'>'+PH.icon('chevrons-left')+'</button>'+
        '<button data-p="'+(page-1)+'" '+(page===1?'disabled':'')+'>'+PH.icon('arrow-left')+'</button>';
      for (var p=1;p<=maxPage;p++) html += '<button data-p="'+p+'" class="'+(p===page?'active':'')+'">'+p+'</button>';
      html += '<button data-p="'+(page+1)+'" '+(page===maxPage?'disabled':'')+'>'+PH.icon('arrow-right')+'</button>'+
        '<button data-p="'+maxPage+'" '+(page===maxPage?'disabled':'')+'>'+PH.icon('chevrons-right')+'</button>';
      pag.innerHTML = html;
      pag.querySelectorAll('button[data-p]').forEach(function(b){
        b.addEventListener('click', function(){ page = parseInt(b.getAttribute('data-p'),10); render(); });
      });

      document.getElementById('info').textContent = 'Menampilkan '+(filtered.length?start+1:0)+'–'+Math.min(start+PER_PAGE, filtered.length)+' dari '+filtered.length+' pekerja';
    }

    document.getElementById('cari').addEventListener('input', function(){ page=1; applyFilter(); });
    siteSel.addEventListener('change', function(){ page=1; applyFilter(); });
    document.getElementById('btnReset').addEventListener('click', function(){
      document.getElementById('cari').value=''; siteSel.value=''; page=1; applyFilter();
    });
    document.getElementById('btnExport').addEventListener('click', function(){
      var rows = PH.getWorkers().map(function(w,i){return [i+1, w.nik, w.nama, w.site, w.password];});
      PH.exportCSV('data-pekerja.csv', ['No','NIK','Nama','Lokasi','Kata Sandi'], rows);
      PH.toast('Data pekerja diekspor ke CSV.', 'success');
    });

    applyFilter();
  </script>
</body>
</html>

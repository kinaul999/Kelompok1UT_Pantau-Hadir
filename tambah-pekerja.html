<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Data Pekerja - Pantau Hadir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --biru-sidebar: #b3c0e4;
      --biru-tua: #0a0a5c;
      --biru-teks: #14146b;
      --oranye: #f2661a;
      --abu-input: #d9d9d9;
      --putih: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", Arial, sans-serif;
      color: #000;
      background: var(--putih);
    }

    /* ================= SIDEBAR ================= */
    aside {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
      width: 250px;
      flex-shrink: 0;
      background: var(--biru-sidebar);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 16px;
    }

    .logo { padding: 0 20px 40px; text-align: center; }
    .logo img { max-width: 100%; height: auto; display: block; }

    aside nav { width: 100%; }
    aside nav ul { list-style: none; }

    aside nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 56px;
      color: var(--biru-teks);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s;
    }
    aside nav a:hover { background: rgba(255, 255, 255, .45); }
    aside nav a.aktif { background: var(--putih); }

    .sidebar-bawah {
      margin-top: auto;
      width: 100%;
      padding: 0 24px;
      text-align: center;
    }

    .btn-keluar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      background: var(--putih);
      color: var(--biru-teks);
      border: 1px solid var(--biru-teks);
      border-radius: 8px;
      font: 600 14px "Plus Jakarta Sans", Arial, sans-serif;
      cursor: pointer;
    }
    .btn-keluar:hover { background: #eef1fb; }
    .btn-keluar img { width: 14px; height: 14px; }

    .copyright {
      margin-top: 14px;
      font-size: 9px;
      line-height: 1.4;
      color: var(--biru-teks);
    }
    .copyright small { display: block; margin-top: 6px; font-size: 9px; opacity: .8; }

    /* ================= KONTEN UTAMA ================= */
    .konten {
      flex: 1;
      margin-left: 250px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 24px;
      background: var(--oranye);
      color: var(--putih);
    }
    header h2 {
      font-size: 20px;
      font-style: italic;
      font-weight: 600;
    }
    .admin { display: flex; align-items: center; gap: 12px; font-size: 15px; }
    .admin img {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--putih);
      padding: 2px;
    }

    main {
      flex: 1;
      position: relative;
      padding: 32px 44px 200px;
      background: url("assets/images/images-konstruksi-biru.jpg") no-repeat center bottom / contain;
    }

    main h1 { font-size: 32px; font-weight: 700; line-height: 1.2; }
    main > p { font-size: 18px; margin-top: 2px; }

    form {
      max-width: 820px;
      margin: 24px auto 0;
      padding: 0 8px;
    }

    .field { position: relative; margin-bottom: 14px; }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 18px;
      font-weight: 400;
    }

    input, select {
      display: block;
      width: 100%;
      padding: 9px 12px;
      background: var(--abu-input);
      border: 1px solid transparent;
      border-radius: 2px;
      font: 400 13px "Plus Jakarta Sans", Arial, sans-serif;
      color: #000;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #333; }
    input:focus, select:focus {
      border-color: var(--biru-tua);
      box-shadow: 0 0 0 2px rgba(10, 10, 92, .15);
    }
    select { appearance: auto; cursor: pointer; }

    .field-password img {
      position: absolute;
      right: 12px;
      bottom: 11px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .field-password input { padding-right: 40px; }

    .aksi {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }
    .aksi button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      font: 600 14px "Plus Jakarta Sans", Arial, sans-serif;
      cursor: pointer;
      transition: filter .2s, background .2s;
    }
    .aksi img { width: 14px; height: 14px; }

    .btn-batal {
      background: var(--putih);
      color: var(--biru-teks);
      border: 1px solid var(--biru-teks);
    }
    .btn-batal:hover { background: #eef1fb; }

    .btn-simpan {
      background: var(--biru-tua);
      color: var(--putih);
      border: 1px solid var(--biru-tua);
    }
    .btn-simpan img { filter: invert(1); }
    .btn-simpan:hover { filter: brightness(1.25); }

    @media (max-width: 768px) {
      aside { width: 180px; }
      .konten { margin-left: 180px; }
      .logo { padding: 0 12px 24px; }
      aside nav a { height: 48px; font-size: 13px; }
      main { padding: 24px 20px 160px; }
      main h1 { font-size: 26px; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside>
    <div class="logo">
      <img src="assets/images/logo-pantau-hadir.jpg" width="200" alt="Pantau Hadir - Sistem Absensi Pekerja Proyek">
    </div>

    <nav>
      <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="rekapitulasi-absensi.html">Rekap Absensi</a></li>
        <li><a href="data-pekerja.html" class="aktif">Data Pekerja</a></li>
      </ul>
    </nav>

    <div class="sidebar-bawah">
      <button type="button" class="btn-keluar">Keluar <img src="assets/icons/log-out.svg" alt=""></button>

      <p class="copyright">
        © 2026 Pantau Hadir App<br>Sistem Absensi Pekerja Proyek
        <small>Halaman ini dibuat Oleh Adil Iskandar Z</small>
      </p>
    </div>
  </aside>

  <!-- KONTEN UTAMA -->
  <div class="konten">

    <!-- HEADER -->
    <header>
      <h2>PT. Jalan Baru</h2>
      <div class="admin">
        <span>Admin</span>
        <img src="assets/icons/users.svg" alt="Foto profil admin">
      </div>
    </header>

    <!-- ISI HALAMAN -->
    <main>
      <h1>Tambah Data Pekerja</h1>
      <p>Masukkan data pekerja baru ke dalam sistem.</p>

      <form action="#" method="post">

        <div class="field">
          <label for="nama">Nama Pekerja</label>
          <input type="text" id="nama" name="nama" placeholder="Masukan nama lengkap pekerja">
        </div>

        <div class="field">
          <label for="nik">NIK</label>
          <input type="text" id="nik" name="nik" placeholder="Masukan 16 digit NIK" maxlength="16">
        </div>

        <div class="field">
          <label for="lokasi">Lokasi Kerja</label>
          <select id="lokasi" name="lokasi">
            <option value="">Pilih lokasi proyek</option>
          </select>
        </div>

        <div class="field field-password">
          <label for="password">Buat Password Baru</label>
          <input type="password" id="password" name="password" placeholder="Masukan password baru">
          <img src="assets/icons/eye-off.svg" alt="Tampilkan password">
        </div>

        <div class="aksi">
          <button type="button" class="btn-batal">Batal <img src="assets/icons/circle-x.svg" alt=""></button>
          <button type="submit" class="btn-simpan">Simpan <img src="assets/icons/Check.svg" alt=""></button>
        </div>

      </form>
    </main>

  </div>

</body>
</html>
